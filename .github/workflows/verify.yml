name: Verify skill packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: D1 program gate tests (rent_deposit)
        run: python3 skill/civil-code-plain-answers/tests/run_tests.py
      - name: Program gate tests (earlier 12-scenario material)
        run: python3 -m unittest discover -s tests -q
      - name: Check development case catalog and closed legal exit
        run: |
          python3 tests/build_case_catalog.py
          python3 tests/run_case_catalog.py
          git diff --exit-code -- tests/cases.jsonl reports/CASE_DEVELOPMENT_RUN.json
      - name: Build isolated D1 package
        run: python3 scripts/package.py
      - name: Check packaged behavior and excluded data
        run: python3 tests/smoke_package.py
